apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-client-service
spec:
  type: {{ .Values.service.client.type }}
  ports:
    - port: {{ .Values.service.client.port }}
      targetPort: 80
      {{- if eq .Values.service.client.type "NodePort" }}
      nodePort: {{ .Values.service.client.nodePort }}
      {{- end }}
  selector:
    app: client

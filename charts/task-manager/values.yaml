replicaCount: 1

secrets:
  mongoRootUsername: "admin"
  mongoRootPassword: "password123"

mongo:
  enabled: true
  image: mongo:6.0
  port: 27017

server:
  enabled: true
  image: node:18-alpine
  port: 5000
  env:
    MONGO_URI: "mongodb://admin:password123@mongo:27017/taskmanager?authSource=admin"

client:
  enabled: true
  image: nginx:alpine
  port: 80

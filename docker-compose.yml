services:
  mongodb:
    image: mongo:8
    container_name: task-manager-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  server:
    build: ./server
    container_name: task-manager-server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URL: mongodb://mongodb:27017/task_manager
      MONGO_TEST_URL: mongodb://mongodb:27017/task_manager_test
    depends_on:
      - mongodb
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: task-manager-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongodb_data:
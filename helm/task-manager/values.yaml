replicaCount:
  server: 2
  client: 2
  mongo: 1

image:
  server:
    repository: ghcr.io/geyders/task-manager-server
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  client:
    repository: ghcr.io/geyders/task-manager-client
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  mongo:
    repository: mongo
    tag: "8"
    pullPolicy: IfNotPresent

service:
  server:
    type: ClusterIP
    port: 5000
  client:
    type: NodePort
    port: 80
    nodePort: 30080
  mongo:
    type: ClusterIP
    port: 27017

persistence:
  mongo:
    enabled: true
    size: 1Gi

resources:
  server:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  client:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
  mongo:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  nodeEnv: "production"
  port: "5000"

secrets:
  mongoRootUsername: "admin"
  mongoRootPassword: "labPassword123"
  mongoDatabase: "task_manager"
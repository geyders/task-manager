apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-manager.fullname" . }}-client-service
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
    app: client
spec:
  type: {{ .Values.service.client.type }}
  selector:
    {{- include "task-manager.selectorLabels" . | nindent 4 }}
    app: client
  ports:
    - port: {{ .Values.service.client.port }}
      targetPort: {{ .Values.service.client.port }}
      {{- if eq .Values.service.client.type "NodePort" }}
      nodePort: {{ .Values.service.client.nodePort }}
      {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-mongo-secret
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: {{ .Values.secrets.mongoRootUsername | quote }}
  MONGO_ROOT_PASSWORD: {{ .Values.secrets.mongoRootPassword | quote }}
  MONGO_URL: "mongodb://{{ .Values.secrets.mongoRootUsername }}:{{ .Values.secrets.mongoRootPassword }}@{{ include "task-manager.fullname" . }}-mongo-service:{{ .Values.service.mongo.port }}/{{ .Values.secrets.mongoDatabase }}?authSource=admin"